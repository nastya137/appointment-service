name: appointment-booking

services:
  backend:
    image: appointment-booking-python:dev
    build:
      context: .
    init: true
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/database.db
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app:ro
      - sqlite_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  bot:
    image: appointment-booking-python:dev
    pull_policy: never
    init: true
    command: ["python", "-m", "app.telegram_bot.bot"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      API_BASE_URL: http://backend:8000
    volumes:
      - ./app:/app/app:ro
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    init: true
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  sqlite_data:
  frontend_node_modules:
